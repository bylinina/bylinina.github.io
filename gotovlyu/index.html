<html lang="ru">
<head>

<meta name="theme-color" content="#0D1220" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Готовлю сама">

<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Готовлю сама</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column (max 34rem) with a fixed bottom tab bar; the cook tab
   gets a sticky kitchen clock (stopwatch + running timers). Palette: Delft-blue enamel —
   cool white like an enamel pot, cobalt accent, orange = hands needed, green = cooking by itself. */
:root {
  --bg: #F1F3F8; --surface: #FFFFFF; --sunk: #E6EAF2; --ink: #152036; --muted: #5A6479; --line: #D7DDE9;
  --accent: #23449B; --accent-soft: #E1E8F8; --on-accent: #FFFFFF;
  --hands: #B9471A; --hands-soft: #FBE7DC; --free: #1C7A4E; --free-soft: #DBF0E4;
  --warn: #7E5300; --warn-soft: #FFF1CF; --ok: #1A6644; --ok-soft: #E0F2E8;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px; --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1220; --surface: #161D2D; --sunk: #1E2739; --ink: #E5E9F2; --muted: #9AA4B8; --line: #2A3449;
    --accent: #93B1F6; --accent-soft: #1F2B4A; --on-accent: #0D1220;
    --hands: #F29C6E; --hands-soft: #3A2419; --free: #6FD2A0; --free-soft: #143027;
    --warn: #F1C462; --warn-soft: #332910; --ok: #7AD8A8; --ok-soft: #143027;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1220; --surface: #161D2D; --sunk: #1E2739; --ink: #E5E9F2; --muted: #9AA4B8; --line: #2A3449;
  --accent: #93B1F6; --accent-soft: #1F2B4A; --on-accent: #0D1220;
  --hands: #F29C6E; --hands-soft: #3A2419; --free: #6FD2A0; --free-soft: #143027;
  --warn: #F1C462; --warn-soft: #332910; --ok: #7AD8A8; --ok-soft: #143027;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
.app {
  max-width: 34rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px));
}
h1, h2, h3, p, ul, ol, fieldset { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.brand { display: grid; gap: 4px; margin-bottom: 18px; }
.brand h1 { font: 700 1.7rem/1.1 var(--f-display); letter-spacing: -0.01em; }
.brand p { color: var(--muted); font-size: .95rem; }
.view { display: grid; gap: 22px; }
.sect { font: 700 1.25rem/1.2 var(--f-display); }
.sub { color: var(--muted); font-size: .95rem; margin-top: 4px; }

/* ---------- buttons ---------- */
.btn {
  min-height: 46px; padding: 10px 16px; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: .92rem; }
.btn:disabled { opacity: .4; cursor: default; }

/* ---------- pick ---------- */
.surprise { width: 100%; }
.group { border: 0; padding: 0; display: grid; gap: 8px; }
.group legend { display: flex; align-items: baseline; gap: 10px; padding: 0; margin-bottom: 8px; }
.num { font: 700 .8rem/1 var(--f-mono); color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 5px 7px; align-self: center; }
.gtitle { font-weight: 700; font-size: 1.08rem; }
.ghint { color: var(--muted); font-size: .9rem; }
.opts { display: grid; gap: 8px; }
.opt {
  position: relative; display: grid; grid-template-columns: 2.2rem 1fr 22px; align-items: center; gap: 12px;
  padding: 12px 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); cursor: pointer;
}
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .emo { font-size: 1.6rem; line-height: 1; text-align: center; }
.otxt { display: grid; min-width: 0; }
.oname { font-weight: 600; }
.oblurb { color: var(--muted); font-size: .88rem; line-height: 1.35; }
.opt .tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .tick { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 4px var(--accent-soft); }
.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }

.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 16px; }
.eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.meal { list-style: none; padding: 0; display: grid; gap: 4px; font-weight: 600; font-size: 1.05rem; }
.meal li { display: flex; gap: 10px; align-items: baseline; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--sunk); border-radius: 12px; padding: 10px 10px 8px; display: grid; gap: 2px; }
.fact b { font: 700 1.35rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.fact span { font-size: .78rem; color: var(--muted); line-height: 1.2; }
.fact.big { background: var(--accent); color: var(--on-accent); }
.fact.big span { color: inherit; opacity: .85; }

.viz { display: grid; gap: 8px; }
.viz-title { font-weight: 600; font-size: .95rem; }
.lane, .axis { display: grid; grid-template-columns: 8.8rem minmax(0, 1fr); align-items: center; gap: 8px; }
.lane-name { font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { position: relative; height: 20px; background: var(--sunk); border-radius: 6px; }
.seg { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; }
.seg.h { background: var(--hands); }
.seg.f { background: repeating-linear-gradient(135deg, var(--free) 0 3px, var(--free-soft) 3px 7px); }
.ticks { position: relative; height: 16px; font: 500 .7rem/16px var(--f-mono); color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.legend .h { background: var(--hands); }
.legend .f { background: repeating-linear-gradient(135deg, var(--free) 0 3px, var(--free-soft) 3px 7px); }

details > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "＋"; color: var(--muted); font-weight: 400; }
details[open] > summary::after { content: "－"; }
.eq ul { margin-top: 10px; padding-left: 1.2rem; display: grid; gap: 4px; }
.cta { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }

/* ---------- boxes / text bits ---------- */
.box { border-radius: 12px; padding: 12px 14px; font-size: .98rem; display: grid; gap: 10px; }
.box.warn { background: var(--warn-soft); color: var(--warn); }
.box.ok { background: var(--ok-soft); color: var(--ok); }
.box.timer { background: var(--free-soft); color: var(--free); }
.box.timer .btn { justify-self: start; background: var(--free); border-color: var(--free); color: var(--surface); }
.tipline { color: var(--muted); font-size: .93rem; }
.dial { display: inline-flex; align-items: flex-end; gap: 2px; margin: 0 3px 0 5px; vertical-align: -1px; }
.dial i { width: 3px; background: var(--line); border-radius: 1px; }
.dial i.on { background: var(--hands); }
.dial-n { font: 600 .78em var(--f-mono); color: var(--muted); }

/* ---------- shop ---------- */
.list { list-style: none; padding: 0; display: grid; gap: 8px; }
.list li label { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; }
.list input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); }
.itxt { display: grid; gap: 3px; min-width: 0; }
.iname { font-weight: 600; }
.amt { font-weight: 700; color: var(--accent); white-space: nowrap; }
.approx { color: var(--muted); font-weight: 400; font-size: .9rem; }
.nl { font-size: .88rem; font-style: italic; color: var(--ink); }
.inote { font-size: .86rem; color: var(--muted); line-height: 1.4; }
.list li.done .iname, .list li.done .amt { text-decoration: line-through; color: var(--muted); }
.list.pantry li label { padding: 10px 14px; }
.copyrow { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.copied { color: var(--ok); font-weight: 600; }
.copybox { width: 100%; min-height: 12rem; font: .85rem/1.4 var(--f-mono); border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface); color: var(--ink); }

/* ---------- cook ---------- */
.clock {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line);
}
.sw { display: grid; line-height: 1.05; margin-right: auto; }
.sw-time { font: 700 1.7rem/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.sw-label { font-size: .75rem; color: var(--muted); }
.timers { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.timers:empty { display: none; }
.chip { font: 700 .9rem/1 var(--f-mono); padding: 8px 12px; border-radius: 999px; border: 0; background: var(--free-soft); color: var(--free); cursor: pointer; }
.chip.done { background: var(--hands); color: var(--on-accent); }
@media (prefers-reduced-motion: no-preference) { .chip.done { animation: pulse 1s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .55; } }

.progress { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent); }
.stepmeta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-top: 6px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 20px; display: grid; gap: 14px; }
.when { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.due { color: var(--accent); font-family: var(--f-mono); letter-spacing: 0; }
.due.now { color: var(--hands); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills:empty { display: none; }
.pill { font-size: .8rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.pill.h { background: var(--hands-soft); color: var(--hands); }
.pill.f { background: var(--free-soft); color: var(--free); }
.pill.p { background: var(--accent-soft); color: var(--accent); }
.titleblock { display: grid; gap: 2px; }
.who { font-weight: 600; color: var(--muted); }
.step h2 { font: 700 1.45rem/1.25 var(--f-body); text-wrap: balance; }
.details { padding-left: 1.25rem; display: grid; gap: 9px; font-size: 1.06rem; line-height: 1.5; }
.details li::marker { color: var(--accent); }
.stepnav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.stepnav .btn { min-height: 54px; font-size: 1.05rem; }
.upnext { color: var(--muted); font-size: .92rem; }
.all ol { list-style: none; padding: 0; margin-top: 10px; display: grid; gap: 2px; }
.all button { width: 100%; text-align: left; display: grid; grid-template-columns: 3.4rem minmax(0, 1fr); gap: 8px; padding: 8px 10px; border: 0; border-radius: 10px; background: none; cursor: pointer; font-size: .95rem; }
.all button.cur { background: var(--accent-soft); font-weight: 600; }
.all .lt { font: 500 .8rem/1.6 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- basics ---------- */
.basic { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.basic ul { margin-top: 10px; padding-left: 1.2rem; display: grid; gap: 8px; }
.basics { display: grid; gap: 8px; }

/* ---------- bottom nav ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs-in { max-width: 34rem; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
.tab { display: grid; justify-items: center; align-content: center; gap: 3px; border: 0; background: none; color: var(--muted); font-size: .75rem; font-weight: 600; cursor: pointer; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }

@media (max-width: 380px) {
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lane, .axis { grid-template-columns: 7.4rem minmax(0, 1fr); }
}
</style>

</head>
<body>
<div class="app">
  <header class="brand">
    <h1>Готовлю сама</h1>
    <p>2 порции: на сегодня и на завтра · кастрюля, сковородка, микроволновка</p>
  </header>

  <section class="view" id="v-pick" aria-label="Выбор блюда">
    <button class="btn surprise" id="surprise" type="button">🎲 Удиви меня</button>
    <fieldset class="group"><legend><span class="num">1</span><span class="gtitle">Мясо или рыба</span><span class="ghint">в сковородке</span></legend><div class="opts" id="g-main"></div></fieldset>
    <fieldset class="group"><legend><span class="num">2</span><span class="gtitle">Гарнир</span><span class="ghint">в кастрюле</span></legend><div class="opts" id="g-side"></div></fieldset>
    <fieldset class="group"><legend><span class="num">3</span><span class="gtitle">Овощи</span></legend><div class="opts" id="g-veg"></div></fieldset>
    <fieldset class="group"><legend><span class="num">4</span><span class="gtitle">Соус</span><span class="ghint">по желанию</span></legend><div class="opts" id="g-sauce"></div></fieldset>
    <div class="summary" id="summary"></div>
  </section>

  <section class="view" id="v-shop" aria-label="Покупки" hidden></section>
  <section class="view" id="v-cook" aria-label="Готовка" hidden></section>
  <section class="view" id="v-basics" aria-label="Основы" hidden></section>
</div>

<nav class="tabs" aria-label="Разделы">
  <div class="tabs-in">
    <button class="tab" data-tab="pick" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>Выбор</button>
    <button class="tab" data-tab="shop" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18l-2 11H5L3 9z"/><path d="M8 9l3-6M16 9l-3-6"/></svg>Покупки</button>
    <button class="tab" data-tab="cook" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9.5" cy="13" r="6.5"/><path d="M16 13h6"/><path d="M7 5c0-1 1-1 1-2M11 5c0-1 1-1 1-2"/></svg>Готовка</button>
    <button class="tab" data-tab="basics" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".6" fill="currentColor"/></svg>Основы</button>
  </div>
</nav>

  const DATA = {"menu":{"mains":[{"id":"chicken","name":"Курица (кусочки бедра)","emoji":"🍗","blurb":"Сочная, её трудно пересушить, с паприкой и чесноком · ~15 мин","sauces":["none","tomato","soyhoney","pesto","yogurt"],"sides":["rice","potatoes","pasta","couscous","noodles"],"veg":["broccoli","beans","salad"]},{"id":"salmon","name":"Лосось (филе)","emoji":"🐟","blurb":"Хрустящая шкурка, лимон · ~12 мин","sauces":["none","soyhoney","pesto","yogurt"],"sides":["rice","potatoes","couscous","noodles","pasta"],"veg":["broccoli","beans","salad"]},{"id":"mince","name":"Говяжий фарш с луком","emoji":"🥩","blurb":"С макаронами без соуса — «макароны по-флотски» · ~15 мин","sauces":["none","tomato","yogurt"],"sides":["pasta","rice","potatoes","couscous"],"veg":["salad","beans","broccoli"]},{"id":"sausages","name":"Сосиски (knakworst)","emoji":"🌭","blurb":"Только прогреть в горячей воде — проще некуда · ~12 мин","sauces":["none","tomato","pesto"],"sides":["potatoes","pasta","rice"],"veg":["beans","broccoli","salad"]},{"id":"shrimp","name":"Креветки с чесноком","emoji":"🍤","blurb":"Очень быстро, в чесночном масле · ~7 мин (замороженные сначала разморозить)","sauces":["none","tomato","soyhoney","pesto"],"sides":["pasta","rice","noodles","couscous"],"veg":["broccoli","beans","salad"]}],"sides":[{"id":"rice","name":"Рис в пакетиках","emoji":"🍚","blurb":"Варится прямо в пакетике — не пригорит и не разварится · ~25 мин (в основном ждать)"},{"id":"pasta","name":"Макароны (пенне или фузилли)","emoji":"🍝","blurb":"Классика, подходит почти ко всему · ~23 мин"},{"id":"potatoes","name":"Молодая картошка (без чистки)","emoji":"🥔","blurb":"Маленькие картофелины со сливочным маслом · ~26 мин (в основном ждать)"},{"id":"couscous","name":"Кускус","emoji":"🌾","blurb":"Самый быстрый гарнир — просто залить кипятком · ~10 мин"},{"id":"noodles","name":"Яичная лапша","emoji":"🍜","blurb":"Быстрая лапша с соевым соусом · ~16 мин"}],"veg":[{"id":"broccoli","name":"Брокколи","emoji":"🥦","blurb":"В микроволновке · ~6 мин"},{"id":"beans","name":"Стручковая фасоль","emoji":"🫛","blurb":"Длинная тонкая фасоль, в микроволновке · ~7 мин"},{"id":"salad","name":"Салат из огурца и помидоров","emoji":"🥗","blurb":"Без готовки, свежий · ~5 мин"}],"sauces":[{"id":"none","name":"Без соуса","emoji":"➖","blurb":"Просто и вкусно","sides":[]},{"id":"tomato","name":"Томатный соус","emoji":"🍅","blurb":"5 минут в сковородке вместе с основным — лучше всего с макаронами","sides":["pasta","rice","couscous","potatoes"]},{"id":"soyhoney","name":"Соево-медовая глазурь","emoji":"🍯","blurb":"1 минута в сковородке — сладко-солёная, к рису и лапше","sides":["rice","noodles","couscous"]},{"id":"pesto","name":"Песто","emoji":"🌿","blurb":"Из баночки, готовить не надо — к макаронам, картошке, кускусу","sides":["pasta","potatoes","couscous"]},{"id":"yogurt","name":"Чесночный йогуртовый соус","emoji":"🥛","blurb":"Холодный, без готовки — к курице, лососю, картошке","sides":["potatoes","couscous","rice"]}]},"basics":[["🔥 Сначала — безопасность",["**Не уходи из кухни, пока включена плита.** Отойти на пару шагов — можно.","**Загорелось масло в сковородке?** Выключи плиту и накрой сковородку крышкой или большой тарелкой. НИКОГДА не лей воду на горящее масло — будет вспышка. Не неси горящую сковородку. Если не гаснет: выйди, закрой дверь, звони 112.","**Ожоги паром** — самые частые на кухне. Когда сливаешь воду или открываешь миску из микроволновки — всегда от лица.","**Горячие ручки:** ручки кастрюли и сковородки нагреваются. Бери сухим полотенцем или прихваткой (мокрое полотенце пропускает жар).","Поворачивай ручки сковородок внутрь плиты, чтобы никто их не задел."]],["🧼 Сырое мясо и рыба",["Сначала режь овощи, а сырое мясо или рыбу — **в самом конце**. Тогда доску и нож надо мыть только один раз.","Потрогала сырое мясо или рыбу — вымой руки с мылом (20 секунд), прежде чем трогать что-то ещё.","Доску, нож и миску сразу вымой горячей водой со средством для посуды.","Сырую курицу не мой под краном — брызги разносят микробы по раковине.","Сырое мясо храни на **нижней полке** холодильника, чтобы ничего не капало на другую еду."]],["🌡️ Сила огня",["**СЛАБЫЙ** = 2–3 из 9 · **СРЕДНИЙ** = 5–6 · **ВЫШЕ СРЕДНЕГО** = 7 · **СИЛЬНЫЙ** = 9.","Электрическая плита (чёрное стекло) реагирует медленно и долго остаётся горячей после выключения — чтобы остановить готовку, сдвинь кастрюлю на холодную конфорку.","Индукционная плита реагирует сразу, но работает только с посудой, к дну которой прилипает магнит.","Все плиты немного разные. Раза после 2–3 ты свою узнаешь."]],["✅ Как понять, что готово",["**Курица:** разрежь самый большой кусок — внутри белая, без розового, сок прозрачный. (Термометр: 75 °C.)","**Фарш:** нигде не осталось розового.","**Лосось:** расслаивается вилкой на пластинки, внутри светло-розовый.","**Креветки:** розово-оранжевые со всех сторон, свернулись в «С».","**Сосиски:** горячие внутри (разрежь одну).","**Макароны:** укуси — мягкие, но с чуть заметной упругостью в серединке.","**Картошка:** нож входит легко, без сопротивления.","Сомневаешься — ещё 1–2 минуты. Мясо лучше чуть пережарить, чем недожарить."]],["🥡 Порция на завтра",["Переложи завтрашнюю порцию в контейнер, дай немного остыть **с открытой крышкой**, потом закрой и в холодильник — **рис не позже чем через час**, всё остальное — не позже чем через 2 часа.","Съешь на следующий день.","Разогревай в микроволновке, крышку положи сверху неплотно (или накрой тарелкой), 2–3 минуты на полной мощности, **на середине перемешай** — должно быть горячим насквозь.","Разогревай только один раз. Особенно рис — никогда не дважды.","Пластиковый контейнер — только с пометкой «для микроволновки». Металл и фольгу в микроволновку нельзя."]],["🔪 Нож",["Острый нож безопаснее тупого — он не соскальзывает.","Подложи под доску влажное полотенце — она не будет ездить по столу.","Держи продукт пальцами, подогнутыми внутрь («коготки»), костяшками к ножу.","Круглое (лук, помидор): сначала срежь бочок и положи на срез — не будет кататься."]],["🥄 Как мерить без весов",["**Кружка** = обычная чайная кружка. Для кускуса меряй крупу И воду одной и той же кружкой — тогда пропорция правильная при любом размере.","**ст. л.** = столовая ложка (большая, суповая) · **ч. л.** = чайная ложка.","**Щепотка** = сколько захватишь большим и двумя пальцами.","**Зубчик чеснока** = одна долька из головки, а не вся головка!"]],["🛍️ Недорогая посуда, которая пригодится",["Дуршлаг — для макарон, картошки, лапши.","Кастрюля С КРЫШКОЙ и сковородка с антипригарным покрытием.","Деревянная ложка + плоская лопатка.","Миска для микроволновки (стекло или керамика) + тарелка, которой её можно накрыть.","Острый нож и разделочная доска.","2–3 контейнера с крышками (для порции на завтра).","Полотенце или прихватка, бумажные полотенца, средство для посуды и губка.","По желанию: кухонные весы (≈ €10) и термометр для мяса (≈ €10)."]]],"S":[{"p":"prep","e":"📋","x":"Приготовься","d":["Сначала один раз прочитай все шаги — это правда помогает.","Освободи и протри стол. Вымой руки с мылом.","Достань всё, что понадобится: сковородка, лопатка или деревянная ложка, нож, разделочная доска, миска, кастрюля, вилка, ножницы или нож, тарелка, миска для микроволновки, тарелка, чтобы накрыть миску, контейнер с крышкой (для порции на завтра), полотенце или прихватка, телефон (секундомер и таймер).","Достань все продукты (список — во вкладке «Покупки»)."],"tip":"Подготовить всё ДО того, как включишь плиту, — главный секрет спокойной готовки."},{"p":"prep","e":"🥦","x":"Нарежь брокколи","d":["Отрежь «деревца» (соцветия) от толстого стебля — там, где они от него отходят.","Большие соцветия разрежь пополам, чтобы все были на один укус.","Стебель тоже съедобный: отрежь сухой низ, срежь жёсткую кожицу и нарежь тонкими кружками.","Промой всё под краном и сложи в миску для микроволновки."],"m":4},{"p":"prep","e":"🍚","x":"Посмотри время варки риса","d":["Найди на коробке время варки: обычно 10–15 минут, у «snelkook» — около 10.","Запомни его — оно понадобится.","Достань 2 пакетика."],"m":1},{"p":"prep","e":"🍗","x":"Нарежь курицу","d":["Положи курицу на доску.","Нарежь кусочками примерно по 3 см (с крупную виноградину). Старайся, чтобы кусочки были примерно одинаковые — тогда они приготовятся одновременно.","Крупные белые кусочки жира можно отрезать, но не обязательно.","Сложи кусочки в миску.","Сырую курицу НЕ мой под краном — брызги разносят микробы по всей раковине."],"m":4},{"p":"prep","e":"🍗","x":"Приправь курицу","d":["Добавь в миску: ½ ч. л. соли, щепотку перца, 1 ч. л. паприки, ½ ч. л. чесночного порошка.","Перемешай ложкой, чтобы на каждом кусочке была красная приправа."],"m":1},{"p":"prep","e":"🧼","x":"Убери после сырого мяса или рыбы","d":["Доску, нож и всё, что касалось сырого мяса или рыбы, вымой горячей водой со средством для посуды.","Вымой руки с мылом — 20 секунд.","Бумажные полотенца, которые касались сырого, — сразу в мусор."],"w":"Микробы с сырого мяса + доска, на которой потом режешь салат = так и случаются отравления."},{"p":"prep","e":"⏱️","x":"Всё готово — включи секундомер","d":["Открой секундомер в телефоне и запусти его. Это минута 0.","У каждого шага готовки написано, на какой минуте его делать (например, «на 12-й минуте»). Чуть раньше или позже — не страшно, главное — порядок.","Если шаг говорит «поставь таймер» — включи ещё и таймер (секундомер пусть идёт дальше).","Шаги с пометкой «готовится само» — еда готовится сама, сразу переходи к следующему шагу."]},{"p":"cook","e":"🍚","x":"Рис: поставь воду","d":["Налей в кастрюлю воды примерно на ⅔ — пакетики должны полностью уйти под воду и свободно плавать.","Накрой крышкой. Огонь — СИЛЬНЫЙ (9 из 9)."],"m":1,"h":1},{"p":"cook","e":"🍚","x":"Рис: подожди, пока вода закипит","d":["Около 8 минут. Можно заняться другими шагами."],"tm":8,"c":"Крупные пузыри бурлят по всей поверхности = кипит.","m":8,"h":0},{"p":"cook","e":"🍗","x":"Курица: разогрей масло","d":["Сковородку на плиту, огонь — ВЫШЕ СРЕДНЕГО (7 из 9).","Налей 1 ст. л. масла. Подожди 1–2 минуты."],"c":"Масло горячее, когда становится жиже, слегка переливается и быстро растекается, если наклонить сковородку.","m":2,"h":1},{"p":"cook","e":"🍗","x":"Курица: выложи в сковородку","d":["Высыпь кусочки в сковородку — опусти миску низко к сковородке, не бросай сверху (горячее масло брызгается).","Разложи в один слой, не друг на друга.","Теперь НЕ трогай их. Именно так получается золотистая корочка.","Вымой руки — ты держала миску с сырой курицей."],"w":"Будет шипеть и немного брызгаться — это нормально. Отойди чуть назад.","m":1,"h":1},{"p":"cook","e":"🍗","x":"Курица: пусть подрумянится","d":["4 минуты не мешай. Не уходи из кухни."],"tm":4,"m":4,"h":0},{"p":"cook","e":"🍚","x":"Рис: опусти пакетики","d":["Добавь в воду ½ ч. л. соли (по желанию).","Аккуратно опусти оба пакетика в воду. Пакетики НЕ открывай — рис варится прямо в них.","Убавь огонь до СРЕДНИЙ (5–6 из 9), чтобы вода спокойно кипела. Крышку больше НЕ закрывай — иначе убежит."],"m":1,"h":1},{"p":"cook","e":"🍚","x":"Рис: пусть варится","d":["Столько минут, сколько написано на коробке (обычно 10–15).","Можно один раз перевернуть пакетики вилкой.","Если воды стало мало и пакетики торчат — подлей горячей воды из-под крана."],"tm":11,"m":11,"h":0},{"p":"cook","e":"🍗","x":"Курица: переверни кусочки","d":["Переверни каждый кусочек лопаткой или вилкой. Снизу они должны быть золотисто-коричневые.","Ещё бледные? Подожди ещё минуту."],"m":1,"h":1},{"p":"cook","e":"🍗","x":"Курица: обжарь с другой стороны","d":["Помешивай раз в 1–2 минуты, чтобы обжарилась со всех сторон."],"tm":5,"m":5,"h":0},{"p":"cook","e":"🥦","x":"Брокколи: в микроволновку","d":["Добавь к брокколи 3 ст. л. воды.","Накрой тарелкой (НЕ фольгой и ничем металлическим!).","Микроволновка на ПОЛНУЮ мощность, 4 минуты."],"m":1,"h":1},{"p":"cook","e":"🥦","x":"Брокколи: греется в микроволновке","tm":4,"m":4,"h":0},{"p":"cook","e":"🍗","x":"Курица: проверь, готова ли","d":["Возьми САМЫЙ БОЛЬШОЙ кусочек и разрежь пополам."],"c":"Внутри белая, без розового, сок прозрачный (не розовый). Не уверена — жарь ещё 2 минуты: бедро не пересыхает.","m":1,"h":1},{"p":"cook","e":"🍗","x":"Курица: сними с огня и накрой","d":["Выключи огонь.","Переложи курицу лопаткой на тарелку.","Накрой сверху второй тарелкой (перевёрнутой) — так останется тёплым 10–15 минут."],"m":1,"h":1},{"p":"cook","e":"🥦","x":"Брокколи: проверь и заправь","d":["Достань миску полотенцем — она горячая.","Приподними тарелку со стороны ОТ СЕБЯ — вырвется пар.","Проткни соцветие вилкой.","Придерживая тарелку с небольшой щелью, слей воду в раковину.","Добавь кусочек сливочного масла (1 ч. л.) и щепотку соли. Перемешай и снова накрой, чтобы не остыла."],"c":"Вилка входит легко, но брокколи ещё ярко-зелёная. Твёрдая? Ещё минуту.","w":"Пар обжигает! Накрытую миску всегда открывай от себя.","m":1,"h":1},{"p":"cook","e":"🍚","x":"Рис: достань и открой пакетики","d":["Выключи огонь.","Подцепи пакетик вилкой за край (или за петельку, если она есть) и вытащи. Подержи над кастрюлей 10 секунд, чтобы стекла вода.","Положи на тарелку и разрежь ножницами или ножом — осторожно, изнутри выйдет горячий пар!","Вылей воду из кастрюли в раковину, высыпь рис обратно в пустую кастрюлю и накрой крышкой — так он останется тёплым."],"w":"Пакетик очень горячий — не бери его руками.","m":2,"h":1},{"p":"serve","e":"🍽️","x":"Раскладывай и убери порцию на завтра","d":["Разрыхли рис вилкой.","Выключи ВСЕ конфорки — проверь каждую ручку.","Раздели всё на две равные части: одну — себе на тарелку, вторую — в контейнер на завтра.","Контейнер на завтра оставь ОТКРЫТЫМ на столе, пока ешь, — пусть остынет. Потом закрой и в холодильник — не позже чем через час, из-за риса.","Залей кастрюлю и сковородку горячей водой с каплей средства для посуды — после ужина отмоются гораздо легче."],"tip":"Приятного аппетита — ты это сама приготовила! 🎉"},{"p":"tomorrow","e":"📦","x":"Завтра: разогрей вторую порцию","d":["Поставь контейнер в микроволновку, крышку положи сверху неплотно (или накрой тарелкой), 2–3 минуты на полно   function shopText(p) {
    const lines = ["Покупки — " + mealName(), ""];
    p.b.forEach((i) => { const it = DATA.I[i]; lines.push(`[ ] ${it.n} — ${it.a || ""}${it.ap ? " (" + it.ap + ")" : ""}${it.du ? " — " + it.du : ""}`); });
    lines.push("", "Проверить дома:");
    p.p.forEach((i) => { const it = DATA.I[i]; lines.push(`[ ] ${it.n}${it.du ? " — " + it.du : ""}`); });
    return lines.join("\n");
  }
  const mealName = () => [MAINS[sel.main], SIDES[sel.side], VEG[sel.veg]].concat(sel.sauce !== "none" ? [SAUCES[sel.sauce]] : []).map((x) => x.name).join(" + ");
  function renderShop() {
    const p = plan();
    const row = (i, kind, n) => {
      const it = DATA.I[i], k = kind + ":" + it.n, on = !!checks[k];
      return `<li class="${on ? "done" : ""}"><label for="c-${kind}${n}">
        <input type="checkbox" id="c-${kind}${n}" data-k="${esc(k)}"${on ? " checked" : ""}>
        <span class="itxt"><span class="iname">${esc(it.n)}${it.a ? ` <span class="amt">${esc(it.a)}</span>` : ""}${it.ap ? ` <span class="approx">(${esc(it.ap)})</span>` : ""}</span>
        ${it.du ? `<span class="nl">🇳🇱 ${esc(it.du)}</span>` : ""}${it.no ? `<span class="inote">${esc(it.no)}</span>` : ""}</span></label></li>`;
    };
    $("#v-shop").innerHTML = `
      <div><h2 class="sect">Покупки</h2><p class="sub">На 2 порции: ${esc(mealName())}. 🇳🇱 — как написано на упаковке в магазине.</p></div>
      <ul class="list">${p.b.map((i, n) => row(i, "b", n)).join("")}</ul>
      <div><h3 class="gtitle">Проверь, есть ли дома</h3><p class="sub">Покупаются один раз и надолго.</p></div>
      <ul class="list pantry">${p.p.map((i, n) => row(i, "p", n)).join("")}</ul>
      <div class="copyrow"><button class="btn" type="button" id="copy">Скопировать список</button><button class="btn" type="button" id="uncheck">Снять все галочки</button><span class="copied" id="copied" hidden>Скопировано</span></div>
      <textarea class="copybox" id="copybox" readonly hidden aria-label="Список покупок текстом"></textarea>`;
  }
  $("#v-shop").addEventListener("change", (e) => {
    const c = e.target;
    if (c.type !== "checkbox") return;
    checks[c.dataset.k] = c.checked;
    if (!c.checked) delete checks[c.dataset.k];
    store.set("checks", checks);
    c.closest("li").classList.toggle("done", c.checked);
  });
  $("#v-shop").addEventListener("click", (e) => {
    if (e.target.id === "uncheck") { checks = {}; store.set("checks", checks); renderShop(); return; }
    if (e.target.id !== "copy") return;
    const text = shopText(plan());
    const fallback = () => { const box = $("#copybox"); box.value = text; box.hidden = false; box.focus(); box.select(); };
    try {
      navigator.clipboard.writeText(text).then(() => { const c = $("#copied"); c.hidden = false; setTimeout(() => { c.hidden = true; }, 2000); }, fallback);
    } catch (err) { fallback(); }
  });

  // ---------- kitchen clock ----------
  let sw = store.get("sw", { start: null, acc: 0 });     // stopwatch: start timestamp while running + accumulated ms
  let timers = store.get("timers", []);                  // [{id, e, label, end, fired}]
  const swSec = () => ((sw.acc || 0) + (sw.start ? Date.now() - sw.start : 0)) / 1000;
  let audio = null, wake = null;
  function unlockAudio() {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch (e) {}
  }
  function beep() {
    try {
      if (audio) {
        const now = audio.currentTime;
        for (let k = 0; k < 3; k++) {
          const o = audio.createOscillator(), g = audio.createGain(), t0 = now + k * 0.35;
          o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
          g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
          o.start(t0); o.stop(t0 + 0.3);
        }
      }
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate([200, 100, 200, 100, 200]); } catch (e) {}
  }
  async function keepAwake() { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) {} }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && sw.start) keepAwake(); });
  function swStart() { unlockAudio(); if (!sw.start) { sw.start = Date.now(); store.set("sw", sw); } keepAwake(); renderCook(); }
  function swPause() { if (sw.start) { sw.acc = (sw.acc || 0) + Date.now() - sw.start; sw.start = null; store.set("sw", sw); } renderCook(); }
  function swReset() { sw = { start: null, acc: 0 }; store.set("sw", sw); renderCook(); }
  function addTimer(min, label, emo) {
    unlockAudio();
    timers.push({ id: Date.now(), e: emo, label, end: Date.now() + min * 60000, fired: false });
    store.set("timers", timers);
    renderCook();
  }
  function clockHTML() {
    const running = !!sw.start, started = running || sw.acc > 0;
    return `<div class="clock" id="clock">
      <div class="sw"><span class="sw-time" id="sw-time">${mmss(swSec())}</span><span class="sw-label">${running ? "секундомер идёт" : started ? "на паузе" : "секундомер"}</span></div>
      ${running ? `<button class="btn small" type="button" data-sw="pause">Пауза</button>` : `<button class="btn small primary" type="button" data-sw="start">${started ? "Дальше" : "Старт"}</button>`}
      ${started ? `<button class="btn small" type="button" data-sw="reset">Сброс</button>` : ""}
      <div class="timers" id="timers">${timersHTML()}</div></div>`;
  }
  function timersHTML() {
    return timers.map((t) => {
      const left = (t.end - Date.now()) / 1000;
      return left > 0
        ? `<button class="chip" type="button" data-tid="${t.id}" aria-label="Таймер ${esc(t.label)}, осталось ${mmss(left)}. Нажми, чтобы убрать">${t.e} ${mmss(left)}</button>`
        : `<button class="chip done" type="button" data-tid="${t.id}" aria-label="Таймер ${esc(t.label)} закончился. Нажми, чтобы убрать">${t.e} готово!</button>`;
    }).join("");
  }

  // ---------- cook ----------
  let cook = store.get("cook", { key: null, i: 0 });
  let allOpen = false;
  function ensureCook() { if (cook.key !== key()) { cook = { key: key(), i: 0 }; store.set("cook", cook); } }
  function whenText(s) {
    if (s.p === "prep") return "Подготовка · плита ещё выключена";
    if (s.p === "cook") return `Готовка · на ${s.t}-й минуте`;
    if (s.p === "serve") return `Готово · на ${s.t}-й минуте`;
    return "Завтра";
  }
  function dueText(s) {
    if (!(s.p === "cook" || s.p === "serve") || !(sw.start || sw.acc > 0)) return ["", ""];
    const left = s.t * 60 - swSec();
    return left > 0 ? ["через " + mmss(left), ""] : ["пора", "now"];
  }
  function splitTitle(x) {
    const k = x.indexOf(": ");
    return k > 0 && k < 24 ? [x.slice(0, k), x.charAt(k + 2).toUpperCase() + x.slice(k + 3)] : [null, x];
  }
  function stepHTML(s) {
    const [who, title] = splitTitle(s.x);
    const [due, dueCls] = dueText(s);
    let pill = "";
    if (s.p === "cook") pill = s.h ? `<span class="pill h">✋ нужны руки · ${s.m} мин</span>` : `<span class="pill f">🙌 готовится само · ${s.m} мин</span>`;
    else if (s.p === "prep" && s.m) pill = `<span class="pill p">около ${s.m} мин</span>`;
    const isStopwatchStep = s.e === "⏱️";
    return `<article class="step">
      <div class="when"><span>${whenText(s)}</span><span class="due ${dueCls}" id="due">${due}</span></div>
      <div class="pills">${pill}</div>
      <div class="titleblock">${who ? `<p class="who">${s.e} ${esc(who)}</p><h2>${rich(title)}</h2>` : `<h2>${s.e} ${rich(title)}</h2>`}</div>
      ${s.d ? `<ul class="details">${s.d.map((d) => `<li>${rich(d)}</li>`).join("")}</ul>` : ""}
      ${isStopwatchStep ? (sw.start ? `<div class="box ok"><p><strong>Секундомер идёт</strong> — он наверху экрана. Жми «Дальше».</p></div>`
                                    : `<button class="btn primary" type="button" data-sw="start">Запустить секундомер здесь</button>`) : ""}
      ${s.tm ? `<div class="box timer"><p><strong>Поставь таймер на ${s.tm} мин.</strong> Еда готовится сама — пока ждёшь, переходи к следующему шагу.</p>
               <button class="btn small" type="button" data-timer="${s.tm}" data-label="${esc(who || title)}" data-emo="${s.e}">Запустить таймер на ${s.tm} мин</button></div>` : ""}
      ${s.c ? `<div class="box ok"><p><strong>Как понять:</strong> ${rich(s.c)}</p></div>` : ""}
      ${s.w ? `<div class="box warn"><p><strong>Осторожно:</strong> ${rich(s.w)}</p></div>` : ""}
      ${s.tip ? `<p class="tipline">💡 ${rich(s.tip)}</p>` : ""}
    </article>`;
  }
  function renderCook() {
    ensureCook();
    const S = steps();
    const i = Math.min(cook.i, S.length - 1), s = S[i], nxt = S[i + 1];
    $("#v-cook").innerHTML = `
      ${clockHTML()}
      <div><div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="${S.length}" aria-valuenow="${i + 1}"><div style="width:${((i + 1) / S.length * 100).toFixed(1)}%"></div></div>
        <div class="stepmeta"><span>Шаг ${i + 1} из ${S.length}</span></div></div>
      ${stepHTML(s)}
      <div class="stepnav"><button class="btn" type="button" id="prev"${i === 0 ? " disabled" : ""}>Назад</button><button class="btn primary" type="button" id="next"${nxt ? "" : " disabled"}>Дальше</button></div>
      ${nxt ? `<p class="upnext">Следующий шаг${nxt.p === "cook" ? ` (на ${nxt.t}-й минуте)` : ""}: ${nxt.e} ${esc(nxt.x)}</p>` : ""}
      <details class="all"${allOpen ? " open" : ""}><summary>Все шаги (${S.length})</summary><ol>${
        S.map((x, j) => `<li><button type="button" class="${j === i ? "cur" : ""}" data-step="${j}"><span class="lt">${x.p === "cook" || x.p === "serve" ? x.t + " мин" : ""}</span><span>${x.e} ${esc(x.x)}</span></button></li>`).join("")
      }</ol></details>
      <button class="btn" type="button" id="restart">Начать сначала</button>`;
  }
  function goStep(i) {
    cook.i = Math.max(0, Math.min(steps().length - 1, i));
    store.set("cook", cook);
    renderCook();
    window.scrollTo(0, 0);
  }
  $("#v-cook").addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.id === "next") goStep(cook.i + 1);
    else if (t.id === "prev") goStep(cook.i - 1);
    else if (t.id === "restart") { allOpen = false; goStep(0); }
    else if (t.dataset.step) { allOpen = false; goStep(+t.dataset.step); }
    else if (t.dataset.sw === "start") swStart();
    else if (t.dataset.sw === "pause") swPause();
    else if (t.dataset.sw === "reset") swReset();
    else if (t.dataset.timer) addTimer(+t.dataset.timer, t.dataset.label, t.dataset.emo);
    else if (t.dataset.tid) { timers = timers.filter((x) => String(x.id) !== t.dataset.tid); store.set("timers", timers); renderCook(); }
  });
  $("#v-cook").addEventListener("toggle", (e) => { if (e.target.classList.contains("all")) allOpen = e.target.open; }, true);

  // tick: update clock, timers and "через …" without re-rendering the whole step
  setInterval(() => {
    let fired = false;
    timers.forEach((t) => { if (!t.fired && t.end <= Date.now()) { t.fired = true; fired = true; } });
    if (fired) { store.set("timers", timers); beep(); }
    if (tab !== "cook") return;
    const tEl = $("#sw-time"); if (tEl) tEl.textContent = mmss(swSec());
    const tm = $("#timers"); if (tm) tm.innerHTML = timersHTML();
    const S = steps(), d = $("#due");
    if (d) { const [txt, cls] = dueText(S[Math.min(cook.i, S.length - 1)]); d.textContent = txt; d.className = "due " + cls; }
  }, 1000);

  // ---------- basics ----------
  function renderBasics() {
    $("#v-basics").innerHTML = `<div><h2 class="sect">Основы</h2><p class="sub">Стоит прочитать один раз перед первой готовкой.</p></div>
      <div class="basics">${DATA.basics.map(([t, bl]) => `<details class="basic"><summary>${esc(t)}</summary><ul>${bl.map((b) => `<li>${rich(b)}</li>`).join("")}</ul></details>`).join("")}</div>`;
  }

  // ---------- boot ----------
  ["main", "side", "veg", "sauce"].forEach(renderGroup);
  renderSummary();
  renderShop();
  renderCook();
  renderBasics();
  showTab(tab, false);
})();
</script>

</body>
